name: New Badge
description: Submit a badge for the DevinsBadges Community Library
title: "[NEW] BADGENAME_HERE"
labels:
  - "Status: Not Reviewed"
  - "Badge Suggestion"
assignees:
  - Intensed-dev

body:
  - type: input
    id: badge_name
    attributes:
      label: Badge Name
      description: Enter the name of the badge.
      placeholder: e.g. Modrinth
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what the badge represents and what it should be used for.
      placeholder: Describe your badge...
    validations:
      required: true

  - type: textarea
    id: images
    attributes:
      label: Badge Images
      description: |
        Please upload both the PNG and SVG versions of the badge.

        You can drag and drop the files here.
      placeholder: |
        Please upload:
        - PNG
        - SVG
    validations:
      required: true

  - type: checkboxes
    id: styles
    attributes:
      label: Badge Styles
      description: Select all badge styles that should be included.
      options:
        - label: cozy
        - label: cozy minimal
        - label: compact
        - label: compact minimal
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Badge Category
      description: Select the category of the badge.
      options:
        - --Other--
        - only available (community)
        - available
        - built with
        - built for
        - creator of (community)
        - documentation
        - donate
        - made by (community)
        - requires
        - social
        - supported
        - translate
        - unsupported
        - welcome (community)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: attribution
    attributes:
      label: Attribution
      description: Choose what type of attribution you want to receive.
      options:
        - Default
        - Other
        - Custom Name only
        - URL only
        - Custom Name & URL
      default: 0
    validations:
      required: true

  - type: textarea
    id: attribution_content
    attributes:
      label: Attribution Content
      description: Add your preferred name and/or URL. If you selected Other, describe your preferred attribution here. This will be ignored if you choose Default.
      placeholder: |
        Name: Your Name
        URL: https://example.com
    validations:
      required: false

  - type: input
    id: other_category
    attributes:
      label: Custom Category Name
      description: Only fill this out if you selected Other as the badge category.
      placeholder: e.g. featured
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm the following before submitting your badge.
      options:
        - label: I have provided accurate information to the best of my knowledge.
          required: true
        - label: I am allowed to submit this badge, or I am the copyright holder.
          required: true
        - label: I understand that this submission will be reviewed by the DevinsBadges-Customs maintainers.
          required: true
        - label: I understand that submitting this badge does not automatically mean that the badge will be added.
          required: true
        - label: I understand that, if accepted, my submitted badge will be dedicated to the public domain under CC0 1.0 Universal, to the extent permitted by law.
          required: true
